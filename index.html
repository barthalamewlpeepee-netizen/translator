<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ergbergderggurgen Translator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      background: linear-gradient(145deg, #1b2b44, #0b0f19);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }
    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      padding: 35px;
      border-radius: 22px;
      width: 480px;
      box-shadow: 0 0 50px rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.2);
    }
    h1 {
      text-align: center;
      margin-bottom: 22px;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 0 0 6px #4bb7ff;
    }
    textarea {
      width: 100%;
      height: 120px;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      resize: none;
      background: rgba(255,255,255,0.1);
      color: white;
      margin-bottom: 15px;
    }
    button.translate {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: linear-gradient(135deg, #00aaff, #0077cc);
      color: white;
      transition: 0.25s;
    }
    button.translate:hover {
      transform: scale(1.05);
      filter: brightness(1.1);
    }
    .output {
      width: 100%;
      height: 120px;
      background: rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 14px;
      font-size: 17px;
      overflow-y: auto;
      color: white;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Ergbergderggurgen Translator</h1>
    <textarea id="inputText" placeholder="Enter English text..."></textarea>
    <button class="translate" onclick="translateText()">Translate</button>
    <textarea id="outputText" placeholder="Translated text..." readonly></textarea>
  </div>

  <script>
    function translateWord(word) {
      if (word.length < 2) return word;
      const last = word.charAt(word.length - 1);
      const mid = word.charAt(Math.floor(word.length / 2));
      const middleIndex = Math.floor(word.length / 2);
      let withoutLast = word.slice(0, word.length - 1);
      let withoutMid = withoutLast.slice(0, middleIndex) + withoutLast.slice(middleIndex + 1);
      let result = last + mid + withoutMid;
      const xIndex = Math.floor(result.length / 2);
      return result.slice(0, xIndex) + "x" + result.slice(xIndex);
    }

    function translateText() {
      let text = document.getElementById("inputText").value;
      let words = text.split(/(\s+)/);
      let translated = words.map(w => w.trim().length > 0 ? translateWord(w) : w).join("");
      document.getElementById("outputText").value = translated;
    }
  </script>
</body>
</html>
